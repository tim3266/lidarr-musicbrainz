[project]
name = "lidarr-musicbrainz"
version = "0.1.0"
description = "Seed MusicBrainz release editor from an existing release (Lidarr-friendly bonus editions)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "musicbrainzngs>=0.7.1",
  "requests>=2.31.0",
  "pyyaml>=6.0",
]

[project.scripts]
mb-seed-release = "lidarr_musicbrainz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
